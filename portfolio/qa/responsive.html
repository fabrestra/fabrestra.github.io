<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка узкой вёрстки · Fabrestra</title><style>body{margin:0;padding:25px;background:#e6e9e3;color:#18201e;font:15px/1.6 system-ui}main{max-width:1000px;margin:auto;display:flex;flex-wrap:wrap;gap:35px;align-items:flex-start}.device{width:390px;border:8px solid #18201e;border-radius:20px;overflow:hidden;box-sizing:content-box;background:white}iframe{display:block;width:390px;height:844px;border:0;background:white}.details{max-width:410px;padding-top:25px}select{font:inherit;padding:10px;width:100%;margin:20px 0}h1{font-size:30px;line-height:1.15}p{color:#46554d}output{display:block;background:white;padding:15px;border-radius:10px;white-space:pre-line}.tag{font-size:11px;text-transform:uppercase;letter-spacing:.15em}a{color:inherit}</style></head><body><main><div class="device"><iframe id="preview" src="../" title="Портфолио шириной 390 пикселей"></iframe></div><section class="details"><p class="tag">Fabrestra / проверка адаптивности</p><h1>Та же страница.<br>Узкое окно.</h1><p>Настоящий сайт внутри рамки 390 px. Проверяется перестроение вёрстки, а не мобильная ОС, сенсорный ввод или производительность телефона.</p><label for="page">Выберите страницу</label><select id="page"><option value="../">Портфолио</option><option value="../case.html?id=diority">Diority</option><option value="../case.html?id=repair">Кабинет сервиса</option><option value="../case.html?id=leads">Пульт обращений</option><option value="../case.html?id=landing">Лендинг</option><option value="../case.html?id=estimate">Смета</option><option value="../../">Главная Fabrestra</option></select><output id="result">Проверяю…</output><p><a href="../">Открыть портфолио без рамки</a></p></section></main><script>const frame=document.getElementById('preview');function measure(){const win=frame.contentWindow,doc=frame.contentDocument;document.getElementById('result').textContent='Ширина окна: '+win.innerWidth+' px\nУзкий брейкпоинт: '+(win.matchMedia('(max-width:700px)').matches?'да':'нет')+'\nГоризонтальный выход за экран: '+(doc.documentElement.scrollWidth>win.innerWidth?'есть':'нет');}frame.addEventListener('load',()=>setTimeout(measure,100));document.getElementById('page').addEventListener('change',event=>{frame.src=event.target.value;document.getElementById('result').textContent='Проверяю…';});</script></body></html>
